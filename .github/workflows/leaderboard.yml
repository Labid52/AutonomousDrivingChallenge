# Scores every team's latest code and publishes the leaderboard to GitHub Pages.
# Setup: leaderboard/README.md
name: Leaderboard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: leaderboard

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - id: pages
        uses: actions/configure-pages@v5
      - name: Score teams (student code runs only inside Docker, without network)
        run: python leaderboard/score.py site
        env:
          TEAM_REPOS_TOKEN: ${{ secrets.TEAM_REPOS_TOKEN }}
          PREVIOUS_RESULTS_URL: ${{ steps.pages.outputs.base_url }}/results.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: score
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
